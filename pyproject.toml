[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagents-deep-research"
version = "0.1.0"
description = "A thread-isolated hierarchical DeepAgents research system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "DeepAgents Deep Research contributors" }]
dependencies = [
  "aiofiles==25.1.0",
  "deepagents==0.7.13",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langchain==1.4.0",
  "langchain-core==1.6.2",
  "langchain-openai==1.6.1",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pymysql==1.2.0",
  "pypdf==6.18.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "PyYAML==6.0.3",
  "ragflow-sdk==0.26.0",
  "reportlab==5.0.1",
  "requests==2.34.2",
  "sqlglot==27.29.0",
  "tavily-python==0.8.1",
  "uvicorn[standard]==0.52.4",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
  "types-aiofiles==25.1.0.20260518",
  "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools]
packages = ["agent", "agent.sub_agents", "api", "prompt", "tools", "utils"]

[tool.setuptools.package-data]
prompt = ["prompts.yml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: component integration tests",
  "e2e: full local workflow tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "ui", "docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = [".venv", "ui"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "openpyxl.*",
  "pandas.*",
  "pymysql.*",
  "ragflow_sdk.*",
  "reportlab.*",
  "tavily.*",
  "xlrd.*",
]
ignore_missing_imports = true
